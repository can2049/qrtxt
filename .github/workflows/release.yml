# Build prebuilt binaries for every tagged release.
#
# Triggered by a `v*` tag push, or manually for a dry run:
#
#   gh workflow run release.yml -f tag=v0.8.0 -f dry_run=true
#
# The tag must match the `qrtxt` version in Cargo.toml and must already be
# merged into `main`; otherwise the run stops before anything is published.
# The release job is idempotent: it creates the release if it is missing and
# uploads (or replaces) the assets otherwise.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.8.0"
        required: true
      dry_run:
        description: "Build and attest only; leave the GitHub release untouched"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Check the tag against Cargo.toml and main
        id: check
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "qrtxt") | .version')"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::tag $TAG does not match qrtxt $crate_version in Cargo.toml"
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::$TAG is not on main yet; merge the release pull request first"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # build provenance attestation
      attestations: write   # build provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: build on the oldest supported image so the glibc baseline
          # stays low; the musl archives are fully static.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # macOS: macos-15-intel is the last x86_64 image (planned to retire
          # in August 2027); macos-26 is Apple Silicon.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-26
          # Windows: native x64 and native arm64.
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p qrtxt --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="qrtxt-v${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/qrtxt" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          if [ -f README.zh-CN.md ]; then cp README.zh-CN.md "dist/${name}/"; fi
          "dist/${name}/qrtxt" --version | grep -qx "qrtxt ${VERSION}"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "qrtxt-v$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/qrtxt.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          if (Test-Path README.zh-CN.md) { Copy-Item README.zh-CN.md "dist/$name/" }
          $reported = & "dist/$name/qrtxt.exe" --version
          if ($reported -ne "qrtxt $env:VERSION") {
            throw "built binary reports '$reported', expected 'qrtxt $env:VERSION'"
          }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          # The archives are already compressed.
          compression-level: 0

  release:
    name: Publish release
    needs: [verify, build]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        shell: bash
        run: sha256sum -- * > SHA256SUMS

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
              --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

      - name: Summarize assets
        working-directory: dist
        shell: bash
        run: |
          {
            echo "### Release assets for ${{ needs.verify.outputs.tag }}"
            echo
            echo '```'
            sha256sum -- *
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
