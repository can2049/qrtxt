[package]
name = "qrtxt"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Turn text into a QR code rendered in the terminal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/can2049/qrtxt"
homepage = "https://github.com/can2049/qrtxt"
authors = ["CanWang <canwhut@gmail.com>"]
keywords = ["cli", "qr", "qrcode", "terminal", "unicode"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
datamatrix = "0.3.3"
qrcode = { version = "0.14.1", default-features = false }
# PDF417 and Aztec encoding only; the decoders are pulled in by
# --dev-dependencies for the round-trip tests, so the shipped binary never
# carries them.
rxing = { version = "0.9.3", default-features = false, features = [
    "pdf417",
    "aztec",
    "encoders",
    "encoding_rs",
] }
rustix = { version = "1", features = ["termios"] }

[dev-dependencies]
assert_cmd = "2.2.2"
datamatrix = "0.3.3"
# The round-trip tests decode the rendered PDF417 and Aztec with rxing;
# `decoders` is kept out of the normal dependency tree so the release binary
# stays lean.
rxing = { version = "0.9.3", default-features = false, features = [
    "pdf417",
    "aztec",
    "decoders",
    "encoding_rs",
] }
predicates = "3.1.4"
rqrr = "0.11.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
